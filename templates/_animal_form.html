<form method="post" action="{{ url_for('edit', animal_id=item.id) if item else url_for('create') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="row g-3">
    <div class="col-md-6"><label for="name" class="form-label fw-semibold">Кличка <span class="text-danger">*</span></label><input class="form-control" type="text" id="name" name="name" maxlength="120" required autofocus placeholder="Кличка животного" value="{{ request.form.get('name', item.name if item else '') }}"></div>
    <div class="col-md-6"><label for="species" class="form-label fw-semibold">Вид <span class="text-danger">*</span></label><select class="form-select" name="species" id="species" required>{% for key,label in species_labels.items() %}<option value="{{ key }}" {{ 'selected' if request.form.get('species', item.species if item else 'cat') == key else '' }}>{{ label }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label for="city" class="form-label fw-semibold">Город <span class="text-danger">*</span></label><input class="form-control" id="city" name="city" maxlength="100" required placeholder="Якутск" value="{{ request.form.get('city', item.city if item else '') }}"></div>
    <div class="col-md-6"><label for="age_years" class="form-label fw-semibold">Возраст (лет)</label><input class="form-control" id="age_years" name="age_years" type="number" min="0" max="50" value="{{ request.form.get('age_years', item.age_years if item and item.age_years is not none else '') }}"></div>
    <div class="col-md-6"><label for="gender" class="form-label fw-semibold">Пол</label><select class="form-select" name="gender" id="gender">{% for key,label in gender_labels.items() %}<option value="{{ key }}" {{ 'selected' if request.form.get('gender', item.gender if item else 'unknown') == key else '' }}>{{ label }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label for="size" class="form-label fw-semibold">Размер</label><select class="form-select" name="size" id="size">{% for key,label in size_labels.items() %}<option value="{{ key }}" {{ 'selected' if request.form.get('size', item.size if item else 'medium') == key else '' }}>{{ label }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label for="status" class="form-label fw-semibold">Статус</label><select class="form-select" name="status" id="status">{% for key,label in status_labels.items() %}<option value="{{ key }}" {{ 'selected' if request.form.get('status', item.status if item else 'searching') == key else '' }}>{{ label }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label for="shelter_id" class="form-label fw-semibold">Приют</label><select class="form-select" name="shelter_id" id="shelter_id"><option value="">Не выбран</option>{% for shelter in shelters %}<option value="{{ shelter.id }}" {{ 'selected' if request.form.get('shelter_id', item.shelter_id|string if item and item.shelter_id else '') == shelter.id|string else '' }}>{{ shelter.name }} · {{ shelter.city }}</option>{% endfor %}</select></div>
    <div class="col-12"><label for="description" class="form-label fw-semibold">Описание объявления</label><textarea class="form-control" name="description" id="description" rows="5" maxlength="3000" placeholder="Характер, история и особенности животного">{{ request.form.get('description', item.description if item else '') }}</textarea></div>
    <div class="col-12"><label for="photo_url" class="form-label fw-semibold">Ссылка на фото</label><input class="form-control" id="photo_url" name="photo_url" maxlength="500" placeholder="https://example.org/photo.jpg" value="{{ request.form.get('photo_url', item.photo_url if item else '') }}"><div class="form-text">HTTP(S)-ссылка; если отсутствует, используется иллюстрация.</div></div>
    <div class="col-12"><label for="contact_email" class="form-label fw-semibold">Email для связи</label><input class="form-control" id="contact_email" type="email" name="contact_email" maxlength="254" placeholder="shelter@example.org" value="{{ request.form.get('contact_email', item.contact_email if item else '') }}"></div>
    <div class="col-sm-6"><div class="form-check"><input class="form-check-input" id="vaccinated" type="checkbox" name="vaccinated" {{ 'checked' if (request.form.get('vaccinated') if request.method == 'POST' else item.vaccinated if item else false) else '' }}><label class="form-check-label" for="vaccinated">Вакцинирован(а)</label></div></div>
    <div class="col-sm-6"><div class="form-check"><input class="form-check-input" id="neutered" type="checkbox" name="neutered" {{ 'checked' if (request.form.get('neutered') if request.method == 'POST' else item.neutered if item else false) else '' }}><label class="form-check-label" for="neutered">Стерилизован(а)</label></div></div>
  </div>
  <div class="d-flex justify-content-between align-items-center mt-4"><a href="{{ url_for('animal_detail', animal_id=item.id) if item else url_for('index') }}" class="btn btn-outline-secondary">← Назад</a><button class="btn {{ 'btn-warning' if item else 'btn-primary' }} px-4" type="submit">{{ 'Сохранить изменения' if item else 'Отправить' }}</button></div>
</form>
